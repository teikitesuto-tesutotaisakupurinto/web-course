<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定期テスト対策プリント運営事務局｜WEB講座</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f9;color:#20242a}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #ccd2d8;background:#fff;border-radius:8px;padding:10px 15px}button:hover{opacity:.88}.primary{background:#1f2937;color:#fff;border-color:#1f2937}.danger{background:#b42318;color:#fff;border-color:#b42318}header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand{font-weight:700}.logo{max-height:42px;max-width:220px;object-fit:contain}main{max-width:1100px;margin:auto;padding:28px 18px}.screen{display:none}.screen.active{display:block}.card{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:22px;margin-bottom:18px}.login{max-width:450px;margin:70px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}label{display:block;font-weight:650;margin:14px 0 7px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd1d8;border-radius:8px;background:#fff}textarea{min-height:100px;resize:vertical}.error{background:#fff1f1;color:#a32020;border:1px solid #f1b8b8;padding:12px;border-radius:8px;margin-bottom:15px}.success{background:#effaf1;color:#216e39;border:1px solid #b8dfc1;padding:12px;border-radius:8px;margin-bottom:15px}.muted{color:#69727d}.lesson{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #edf0f2}.lesson:last-child{border-bottom:0}video{display:block;width:100%;max-height:72vh;background:#000;border-radius:9px}.stat{padding:18px;border:1px solid #e1e5ea;border-radius:10px;background:#fff}.stat strong{display:block;font-size:26px;margin-top:5px}.save{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid #ddd;padding:10px 14px;border-radius:999px;box-shadow:0 5px 20px #0001}.small{font-size:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}@media(max-width:600px){header{padding:0 12px}.brand{font-size:14px}main{padding:20px 12px}}
</style>
</head>
<body>
<header>
  <div class="row"><img id="logo" class="logo hidden" alt="ロゴ"><div id="brand" class="brand">定期テスト対策プリント運営事務局｜WEB講座</div></div>
  <button id="logoutButton" class="hidden" onclick="logout()">ログアウト</button>
</header>
<main>
<section id="loginScreen" class="screen active"><div class="card login"><h1>WEB講座</h1><p class="muted">メールアドレスとパスワードでログインしてください。</p><div id="loginError" class="error hidden"></div><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginButton" class="primary" style="width:100%" onclick="login()">ログイン</button></div></section>
<section id="studentScreen" class="screen"><h1>WEB講座</h1><p class="muted">受講する講座を選択してください。</p><div id="studentError" class="error hidden"></div><div id="studentCourses" class="grid"></div></section>
<section id="courseScreen" class="screen"><div class="nav"><button onclick="goStudent()">戻る</button></div><div class="card"><h1 id="courseTitle"></h1><p id="courseDescription" class="muted"></p><div id="lessonList"></div></div></section>
<section id="videoScreen" class="screen"><div class="nav"><button onclick="goCourse()">戻る</button></div><div class="card"><video id="videoPlayer" controls playsinline controlsList="nodownload"></video><h2 id="videoTitle"></h2><h3>備考</h3><p id="videoNote" style="white-space:pre-wrap"></p></div></section>
<section id="teacherScreen" class="screen"><h1>先生・管理者</h1><div class="nav"><button onclick="teacherTab('dashboard')">ダッシュボード</button><button onclick="teacherTab('courses')">講座管理</button><button onclick="teacherTab('users')">ユーザー管理</button><button onclick="teacherTab('notice')">アカウント情報通知書</button><button onclick="teacherTab('settings')">サイト設定</button></div>
<section id="dashboardTab"><div class="grid"><div class="stat">生徒数<strong id="studentCount">0</strong></div><div class="stat">講座数<strong id="courseCount">0</strong></div><div class="stat">公開講座<strong id="publishedCount">0</strong></div><div class="stat">動画数<strong id="videoCount">0</strong></div></div><p id="saveStatus" class="small muted"></p></section>
<section id="coursesTab" class="hidden"><div class="row"><h2>講座管理</h2><button class="primary" onclick="createCourse()">＋ 講座を作成</button></div><div id="teacherCourses" class="grid"></div></section>
<section id="usersTab" class="hidden"><div class="card"><div class="row"><h2>ユーザー管理</h2><button class="primary" onclick="openCreateUser()">＋ ユーザーを追加</button></div><div id="userError" class="error hidden"></div><table><thead><tr><th>メールアドレス</th><th>権限</th><th>操作</th></tr></thead><tbody id="userTable"></tbody></table></div><div id="createUserBox" class="card hidden"><h3>ユーザーを追加</h3><label>メールアドレス</label><input id="newEmail" type="email"><label>初期パスワード</label><input id="newPassword" type="password"><label>権限</label><select id="newRole"><option value="student">生徒</option><option value="teacher">先生・管理者</option></select><div class="actions"><button class="primary" onclick="createUser()">作成</button><button onclick="closeCreateUser()">キャンセル</button></div></div></section>
<section id="noticeTab" class="hidden"><div class="card"><h2>アカウント情報通知書</h2><select id="noticeUser"></select><button class="primary" style="margin-top:12px" onclick="printNotice()">通知書を表示・印刷</button></div></section>
<section id="settingsTab" class="hidden"><div class="card"><h2>サイト設定</h2><label>ロゴ画像</label><input id="logoFile" type="file" accept="image/*"><p class="muted small">ロゴアップロードはCloudinary署名API接続後に本番保存されます。</p><button class="primary" onclick="uploadLogo()">ロゴをアップロード</button></div></section>
</section>
</main>
<div id="saveToast" class="save hidden"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,getDocs,addDoc,deleteDoc,serverTimestamp,query,where}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";
const firebaseConfig={apiKey:"AIzaSyCDDFw2tipCJs_k00E5txFrCW7bVsgJ3O8",authDomain:"web-course-1589c.firebaseapp.com",projectId:"web-course-1589c",storageBucket:"web-course-1589c.firebasestorage.app",messagingSenderId:"175601141864",appId:"1:175601141864:web:ac9092e86c111fa4a053dd"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),functions=getFunctions(app);
const createUserServer=httpsCallable(functions,"createUser");
const getUploadSignature=httpsCallable(functions,"getCloudinaryUploadSignature");
const TEST_VIDEO="https://res.cloudinary.com/ufgvd6hz/video/upload/v1787729053/Screen_recording_2026-08-26_16.22.22.webm";
let courses=[],users=[],currentCourse=null,currentUser=null;
const $=id=>document.getElementById(id);
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0)}
function toast(msg){$("saveToast").textContent=msg;$("saveToast").classList.remove("hidden");setTimeout(()=>$("saveToast").classList.add("hidden"),1800)}
function setLoginError(msg){$("loginError").textContent=msg;$("loginError").classList.toggle("hidden",!msg)}
async function login(){const email=$("email").value.trim(),password=$("password").value;setLoginError("");if(!email||!password){setLoginError("メールアドレスとパスワードを入力してください。");return}$("loginButton").disabled=true;try{await signInWithEmailAndPassword(auth,email,password)}catch(e){setLoginError("メールアドレスまたはパスワードが正しくありません。")}finally{$("loginButton").disabled=false}}
async function logout(){await signOut(auth)}
async function getRole(uid){const snap=await getDoc(doc(db,"users",uid));return snap.exists()&&snap.data().role==="teacher"?"teacher":"student"}
async function loadCourses(studentOnly=false){const ref=collection(db,"courses");const snap=studentOnly?await getDocs(query(ref,where("published","==",true))):await getDocs(ref);courses=snap.docs.map(d=>({id:d.id,...d.data(),lessons:d.data().lessons||[]}))}
async function loadUsers(){const snap=await getDocs(collection(db,"users"));users=snap.docs.map(d=>({id:d.id,...d.data()}))}
async function loadSettings(){const s=await getDoc(doc(db,"settings","site"));if(s.exists()&&s.data().logoUrl)applyLogo(s.data().logoUrl)}
onAuthStateChanged(auth,async user=>{if(!user){currentUser=null;$("logoutButton").classList.add("hidden");showScreen("loginScreen");return}currentUser=user;$("logoutButton").classList.remove("hidden");try{const r=await getRole(user.uid);if(r==="teacher")await showTeacher();else await showStudent()}catch(e){showScreen("loginScreen");setLoginError("ユーザー情報を確認できませんでした。")}});
async function showStudent(){showScreen("studentScreen");try{await loadCourses(true);renderStudent()}catch(e){$("studentError").textContent="講座を読み込めませんでした。";$("studentError").classList.remove("hidden")}}
function goStudent(){showStudent()}
function renderStudent(){const box=$("studentCourses");box.innerHTML="";courses.forEach(c=>{const d=document.createElement("div");d.className="card";const h=document.createElement("h2");h.textContent=c.title;const p=document.createElement("p");p.className="muted";p.textContent=c.description||"";const n=document.createElement("p");n.textContent=(c.lessons||[]).length+"動画";const b=document.createElement("button");b.className="primary";b.textContent="講座を見る";b.onclick=()=>openCourse(c.id);d.append(h,p,n,b);box.appendChild(d)})}
function openCourse(id){currentCourse=courses.find(c=>c.id===id);if(!currentCourse){alert("講座を読み込めませんでした。");return}$("courseTitle").textContent=currentCourse.title;$("courseDescription").textContent=currentCourse.description||"";const list=$("lessonList");list.innerHTML="";(currentCourse.lessons||[]).forEach((l,i)=>{const row=document.createElement("div");row.className="lesson";const s=document.createElement("span");s.textContent=String(i+1).padStart(2,"0")+" "+l.title;const b=document.createElement("button");b.textContent="見る";b.onclick=()=>openVideo(l.id);row.append(s,b);list.appendChild(row)});showScreen("courseScreen")}
function goCourse(){openCourse(currentCourse.id)}
function openVideo(id){const l=(currentCourse.lessons||[]).find(x=>x.id===id);if(!l){alert("動画を再生できませんでした。");return}$("videoTitle").textContent=l.title;$("videoNote").textContent=l.note||"";$("videoPlayer").src=l.videoUrl;showScreen("videoScreen")}
async function showTeacher(){showScreen("teacherScreen");try{await Promise.all([loadCourses(false),loadUsers(),loadSettings()]);teacherTab("dashboard")}catch(e){alert("管理データを読み込めませんでした。")}}
function teacherTab(t){["dashboardTab","coursesTab","usersTab","noticeTab","settingsTab"].forEach(id=>$(id).classList.add("hidden"));const m={dashboard:"dashboardTab",courses:"coursesTab",users:"usersTab",notice:"noticeTab",settings:"settingsTab"};$(m[t]).classList.remove("hidden");if(t==="dashboard")renderDashboard();if(t==="courses")renderTeacherCourses();if(t==="users")renderUsers();if(t==="notice")renderNoticeUsers()}
function renderDashboard(){$("studentCount").textContent=users.filter(u=>u.role==="student").length;$('courseCount').textContent=courses.length;$('publishedCount').textContent=courses.filter(c=>c.published).length;$('videoCount').textContent=courses.reduce((n,c)=>n+(c.lessons||[]).length,0)}
async function saveCourse(c){$("saveStatus").textContent="保存中...";try{const data={title:c.title,description:c.description||"",published:!!c.published,lessons:c.lessons||[],updatedAt:serverTimestamp()};if(String(c.id).startsWith("local-")){const r=await addDoc(collection(db,"courses"),data);c.id=r.id}else await setDoc(doc(db,"courses",c.id),data,{merge:true});$("saveStatus").textContent="自動保存しました";toast("保存しました") }catch(e){$("saveStatus").textContent="保存できませんでした";alert("保存できませんでした。")}}
function renderTeacherCourses(){const box=$("teacherCourses");box.innerHTML="";courses.forEach(c=>{const d=document.createElement("div");d.className="card";d.innerHTML="<label>講座名</label><input class='title'><label>講座説明</label><textarea class='desc'></textarea><p class='state'></p><div class='actions'><button class='primary'>動画を追加</button><button>公開切替</button><button class='danger'>削除</button></div>";const ti=d.querySelector(".title"),de=d.querySelector(".desc");ti.value=c.title;de.value=c.description||"";const updateState=()=>d.querySelector(".state").textContent=(c.lessons||[]).length+"動画 / "+(c.published?"公開中":"非公開");updateState();ti.oninput=()=>{c.title=ti.value;saveCourse(c)};de.oninput=()=>{c.description=de.value;saveCourse(c)};d.querySelectorAll("button")[0].onclick=()=>addLesson(c);d.querySelectorAll("button")[1].onclick=async()=>{c.published=!c.published;updateState();await saveCourse(c);renderDashboard()};d.querySelectorAll("button")[2].onclick=async()=>{if(!confirm("この講座を削除しますか？"))return;try{await deleteDoc(doc(db,"courses",c.id));courses=courses.filter(x=>x.id!==c.id);renderTeacherCourses();renderDashboard()}catch(e){alert("削除できませんでした。")}};box.appendChild(d)})}
async function createCourse(){const title=prompt("講座名を入力してください。");if(!title?.trim())return;const c={id:"local-"+Date.now(),title:title.trim(),description:"",published:false,lessons:[]};courses.push(c);renderTeacherCourses();renderDashboard();await saveCourse(c)}
async function addLesson(c){const title=prompt("動画タイトルを入力してください。");if(!title?.trim())return;const url=prompt("Cloudinaryの動画URLを入力してください。",TEST_VIDEO);if(!url?.trim())return;const note=prompt("備考を入力してください。")||"";c.lessons.push({id:"lesson-"+Date.now(),title:title.trim(),videoUrl:url.trim(),note});await saveCourse(c);renderTeacherCourses();renderDashboard()}
function renderUsers(){const body=$("userTable");body.innerHTML="";users.forEach(u=>{const tr=document.createElement("tr");const e=document.createElement("td");e.textContent=u.email||"";const r=document.createElement("td");r.textContent=u.role==="teacher"?"先生・管理者":"生徒";const a=document.createElement("td");const b=document.createElement("button");b.textContent="通知書";b.onclick=()=>{teacherTab("notice");$("noticeUser").value=u.id};a.appendChild(b);tr.append(e,r,a);body.appendChild(tr)})}
function openCreateUser(){$("createUserBox").classList.remove("hidden")}
function closeCreateUser(){$("createUserBox").classList.add("hidden")}
async function createUser(){const email=$("newEmail").value.trim(),password=$("newPassword").value,role=$("newRole").value,err=$("userError");err.classList.add("hidden");if(!email||password.length<6){err.textContent="メールアドレスと6文字以上の初期パスワードを入力してください。";err.classList.remove("hidden");return}try{const result=await createUserServer({email,password,role});users.push({id:result.data.uid,email,role});renderUsers();renderNoticeUsers();closeCreateUser();$("newEmail").value="";$("newPassword").value="";renderDashboard();toast("ユーザーを作成しました")}catch(e){err.textContent="ユーザーを作成できませんでした。";err.classList.remove("hidden")}}
function renderNoticeUsers(){const s=$("noticeUser");s.innerHTML="";users.forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=u.email;s.appendChild(o)})}
function printNotice(){const u=users.find(x=>x.id===$("noticeUser").value);if(!u)return;const w=window.open("","_blank");if(!w){alert("ポップアップがブロックされています。");return}w.document.write(`<html lang="ja"><head><meta charset="utf-8"><title>アカウント情報通知書</title><style>body{font-family:system-ui;padding:50px}.box{max-width:700px;border:1px solid #aaa;padding:30px}</style></head><body><div class="box"><h1>定期テスト対策プリント運営事務局</h1><h2>WEB講座 アカウント情報通知書</h2><p>ログインID</p><strong>${escapeHtml(u.email)}</strong><p>権限：${u.role==="teacher"?"先生・管理者":"生徒"}</p><p>パスワードは安全上表示しません。</p><button onclick="print()">印刷</button></div></body></html>`);w.document.close()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function uploadLogo(){const f=$("logoFile").files[0];if(!f){alert("ロゴ画像を選択してください。");return}try{const sig=(await getUploadSignature({resourceType:"image",folder:"web-course/logo"})).data;const fd=new FormData();fd.append("file",f);fd.append("api_key",sig.apiKey);fd.append("timestamp",sig.timestamp);fd.append("signature",sig.signature);fd.append("folder",sig.folder);const res=await fetch(`https://api.cloudinary.com/v1_1/${sig.cloudName}/image/upload`,{method:"POST",body:fd});if(!res.ok)throw new Error();const result=await res.json();await setDoc(doc(db,"settings","site"),{logoUrl:result.secure_url,updatedAt:serverTimestamp()},{merge:true});applyLogo(result.secure_url);toast("ロゴを保存しました")}catch(e){alert("ロゴをアップロードできませんでした。")}}
function applyLogo(url){if(url){$("logo").src=url;$("logo").classList.remove("hidden");$("brand").classList.add("hidden")}else{$("logo").classList.add("hidden");$("brand").classList.remove("hidden")}}
window.login=login;window.logout=logout;window.goStudent=goStudent;window.goCourse=goCourse;window.teacherTab=teacherTab;window.createCourse=createCourse;window.addLesson=addLesson;window.openCreateUser=openCreateUser;window.closeCreateUser=closeCreateUser;window.createUser=createUser;window.printNotice=printNotice;window.uploadLogo=uploadLogo;
</script>
</body>
</html>
