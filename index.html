<!DOCTYPE html>
<html lang="ja">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
    background:#f5f6f8;
    color:#222;
}

header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;

}

.brand{

}

.logo{

}

main{
    max-width:1100px;
    margin:auto;

}

.screen{

}

.screen.active{

}

.card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;

}

.login{
    max-width:450px;

}

label{
    display:block;

}

input,
textarea,
select{

    padding:12px;
    border:1px solid #ccc;

    background:#fff;
}

textarea{
    min-height:110px;

}

button{
    padding:11px 17px;
    border-radius:8px;
    border:1px solid #ccc;

}

button:hover{
    opacity:.85;
}

button:disabled{

}

.primary{
    background:#222;
    color:#fff;

}

.danger{
    background:#b42318;
    color:#fff;
    border-color:#b42318;
}

.hidden{
    display:none!important;
}

.error{
    background:#fff1f1;
    color:#a00000;
    border:1px solid #e0aaaa;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:

    gap:18px;
}

.lesson{
    padding:16px 0;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;

}

.nav{
    display:flex;

}

.actions{

}

video{
    width:100%;

    background:#000;
    border-radius:10px;
}

.stat{
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.status{
    position:fixed;
    right:18px;
    bottom:18px;
    background:#fff;
    border:1px solid #ddd;
    padding:10px 14px;
    border-radius:999px;
    box-shadow:0 5px 20px #0001;
    z-index:200;
}

</style>
</head>

<script type="module">

/* ==========================================
   Firebase SDK
========================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    setDoc,
    deleteDoc,
    serverTimestamp,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    getFunctions,
    httpsCallable
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";


/* ==========================================
   Firebase設定
========================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyCDDFw2tipCJs_k00E5txFrCW7bVsgJ3O8",

    authDomain:
    "web-course-1589c.firebaseapp.com",

    projectId:
    "web-course-1589c",

    storageBucket:
    "web-course-1589c.firebasestorage.app",

    messagingSenderId:
    "175601141864",

    appId:
    "1:175601141864:web:ac9092e86c111fa4a053dd"

};


const app =
initializeApp(
    firebaseConfig
);


const auth =
getAuth(
    app
);


const db =
getFirestore(
    app
);


const functions =
getFunctions(
    app
);


/* Functions */

const createUserServer =
httpsCallable(
    functions,
    "createUser"
);


const getCloudinarySignature =
httpsCallable(
    functions,
    "getCloudinaryUploadSignature"
);


/* ==========================================
   状態
========================================== */

let currentUser =
null;

let currentRole =
null;

let courses =
[];

let users =
[];

let currentCourse =
null;


/* ==========================================
   DOM
========================================== */

function $(id){

    return document.getElementById(id);

}


/* ==========================================
   画面切り替え
========================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(
            screen => {

                screen
                    .classList
                    .remove("active");

            }
        );


    $(id)
        .classList
        .add("active");


    window.scrollTo(
        0,
        0
    );

}


/* ==========================================
   エラー
========================================== */

function showError(
    id,
    message
){

    const element =
        $(id);


    element.textContent =
        message;


    element
        .classList
        .remove("hidden");

}


function clearError(id){

    const element =
        $(id);


    element.textContent =
        "";


    element
        .classList
        .add("hidden");

}


/* ==========================================
   ステータス
========================================== */

function status(message){

    $("saveStatus")
        .textContent =
        message;


    setTimeout(
        () => {

            $("saveStatus")
                .textContent =
                "";

        },
        2000
    );

}


/* ==========================================
   ログイン
========================================== */

async function login(){

    const email =
        $("email")
        .value
        .trim();


    const password =
        $("password")
        .value;


    clearError(
        "loginError"
    );


    if(
        !email ||
        !password
    ){

        showError(
            "loginError",
            "メールアドレスとパスワードを入力してください。"
        );

        return;

    }


    $("loginButton")
        .disabled =
        true;


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        /*
         * ここでは画面を変更しない。
         *
         * onAuthStateChangedが
         * ログイン成功を検知して
         * 正しい画面へ移動する。
         */

    }

    catch(error){

        console.error(
            error
        );


        showError(
            "loginError",
            "ログインできませんでした。メールアドレスまたはパスワードを確認してください。"
        );

    }

    finally{

        $("loginButton")
            .disabled =
            false;

    }

}


/* ==========================================
   権限取得
========================================== */

async function getRole(uid){

    try{

        const snapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    uid
                )
            );


        if(
            snapshot.exists()
        ){

            const data =
                snapshot.data();


            if(
                data.role ===
                "teacher"
            ){

                return "teacher";

            }

        }

    }

    catch(error){

        console.error(
            "権限取得エラー",
            error
        );

    }


    return "student";

}


/* ==========================================
   Firebase Authentication監視
========================================== */

onAuthStateChanged(
    auth,
    async user => {

        /*
         * 未ログイン
         */

        if(!user){

            currentUser =
                null;

            currentRole =
                null;


            $("logoutButton")
                .classList
                .add("hidden");


            clearError(
                "loginError"
            );


            showScreen(
                "loginScreen"
            );


            return;

        }


        /*
         * ログイン済み
         */

        currentUser =
            user;


        $("logoutButton")
            .classList
            .remove("hidden");


        /*
         * ログイン成功なので
         * ログイン画面の赤枠を完全に消す
         */

        clearError(
            "loginError"
        );


        /*
         * まず権限を確認
         */

        currentRole =
            await getRole(
                user.uid
            );


        /*
         * ここで画面遷移
         */

        if(
            currentRole ===
            "teacher"
        ){

            showScreen(
                "teacherScreen"
            );


            await loadTeacherData();


            teacherTab(
                "dashboard"
            );

        }

        else{

            showScreen(
                "studentScreen"
            );


            await loadStudentData();

        }

    }
);


/* ==========================================
   ログアウト
========================================== */

async function logout(){

    try{

        await signOut(
            auth
        );

    }

    catch(error){

        console.error(
            error
        );

    }

}


/* ==========================================
   生徒データ
========================================== */

async function loadStudentData(){

    try{

        const q =
            query(
                collection(
                    db,
                    "courses"
                ),
                where(
                    "published",
                    "==",
                    true
                )
            );


        const snapshot =
            await getDocs(
                q
            );


        courses =
            snapshot.docs.map(
                document => ({

                    id:
                    document.id,

                    ...document.data()

                })
            );


        renderStudentCourses();

    }

    catch(error){

        console.error(
            error
        );


        showError(
            "studentError",
            "講座を読み込めませんでした。"
        );

    }

}


/* ==========================================
   生徒講座
========================================== */

function renderStudentCourses(){

    const box =
        $("studentCourses");


    box.innerHTML =
        "";


    if(
        !courses.length
    ){

        box.innerHTML =
            '<div class="card">公開中の講座はありません。</div>';

        return;

    }


    courses.forEach(
        course => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const title =
                document.createElement(
                    "h2"
                );


            title.textContent =
                course.title;


            const description =
                document.createElement(
                    "p"
                );


            description.className =
                "muted";


            description.textContent =
                course.description ||
                "";


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "primary";


            button.textContent =
                "講座を見る";


            button.onclick =
                () =>
                openCourse(
                    course.id
                );


            card.append(
                title,
                description,
                button
            );


            box.appendChild(
                card
            );

        }
    );

}


/* ==========================================
   生徒トップ
========================================== */

async function showStudent(){

    showScreen(
        "studentScreen"
    );


    await loadStudentData();

}


/* ==========================================
   講座
========================================== */

async function openCourse(id){

    currentCourse =
        courses.find(
            course =>
            course.id === id
        );


    if(
        !currentCourse
    ){

        alert(
            "講座を読み込めませんでした。"
        );

        return;

    }


    $("courseTitle")
        .textContent =
        currentCourse.title;


    $("courseDescription")
        .textContent =
        currentCourse.description ||
        "";


    const list =
        $("lessonList");


    list.innerHTML =
        "<p>読み込み中...</p>";


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "courses",
                        id,
                        "lessons"
                    ),
                    where(
                        "published",
                        "==",
                        true
                    )
                )
            );


        const lessons =
            snapshot.docs
                .map(
                    document => ({

                        id:
                        document.id,

                        ...document.data()

                    })
                )
                .sort(
                    (a,b) =>
                    (a.order || 0)
                    -
                    (b.order || 0)
                );


        list.innerHTML =
            "";


        lessons.forEach(
            (lesson,index) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "lesson";


                const title =
                    document.createElement(
                        "span"
                    );


                title.textContent =
                    String(
                        index + 1
                    )
                    .padStart(
                        2,
                        "0"
                    )
                    +
                    " "
                    +
                    lesson.title;


                const button =
                    document.createElement(
                        "button"
                    );


                button.textContent =
                    "見る";


                button.onclick =
                    () =>
                    openVideo(
                        lesson
                    );


                row.append(
                    title,
                    button
                );


                list.appendChild(
                    row
                );

            }
        );


        if(
            !lessons.length
        ){

            list.innerHTML =
                '<p class="muted">公開中の動画はありません。</p>';

        }


        showScreen(
            "courseScreen"
        );

    }

    catch(error){

        console.error(
            error
        );


        list.innerHTML =
            '<p class="error">動画一覧を読み込めませんでした。</p>';


        showScreen(
            "courseScreen"
        );

    }

}


function goStudent(){

    showStudent();

}


/* ==========================================
   動画
========================================== */

function openVideo(
    lesson
){

    $("videoTitle")
        .textContent =
        lesson.title;


    $("videoNote")
        .textContent =
        lesson.note ||
        "";


    $("videoPlayer")
        .src =
        lesson.videoUrl;


    $("videoPlayer")
        .load();


    showScreen(
        "videoScreen"
    );

}


function goCourse(){

    if(
        currentCourse
    ){

        openCourse(
            currentCourse.id
        );

    }

}


/* ==========================================
   先生
========================================== */

async function showTeacher(){

    showScreen(
        "teacherScreen"
    );


    await loadTeacherData();


    teacherTab(
        "dashboard"
    );

}


/* ==========================================
   先生データ
========================================== */

async function loadTeacherData(){

    try{

        const [
            courseSnapshot,
            userSnapshot,
            settingSnapshot
        ] =
        await Promise.all([

            getDocs(
                collection(
                    db,
                    "courses"
                )
            ),

            getDocs(
                collection(
                    db,
                    "users"
                )
            ),

            getDoc(
                doc(
                    db,
                    "settings",
                    "site"
                )
            )

        ]);


        courses =
            courseSnapshot.docs.map(
                document => ({

                    id:
                    document.id,

                    ...document.data()

                })
            );


        users =
            userSnapshot.docs.map(
                document => ({

                    id:
                    document.id,

                    ...document.data()

                })
            );


        if(
            settingSnapshot.exists()
        ){

            const data =
                settingSnapshot.data();


            if(
                data.logoUrl
            ){

                applyLogo(
                    data.logoUrl
                );

            }

        }

    }

    catch(error){

        console.error(
            error
        );

    }

}


/* ==========================================
   先生タブ
========================================== */

function teacherTab(
    tab
){

    [
        "dashboardTab",
        "coursesTab",
        "usersTab",
        "noticeTab",
        "settingsTab"
    ]
    .forEach(
        id => {

            $(id)
                .classList
                .add("hidden");

        }
    );


    const map = {

        dashboard:
        "dashboardTab",

        courses:
        "coursesTab",

        users:
        "usersTab",

        notice:
        "noticeTab",

        settings:
        "settingsTab"

    };


    $(map[tab])
        .classList
        .remove("hidden");


    if(
        tab ===
        "dashboard"
    ){

        renderDashboard();

    }


    if(
        tab ===
        "courses"
    ){

        renderTeacherCourses();

    }


    if(
        tab ===
        "users"
    ){

        renderUsers();

    }


    if(
        tab ===
        "notice"
    ){

        renderNoticeUsers();

    }

}


/* ==========================================
   ダッシュボード
========================================== */

function renderDashboard(){

    $("studentCount")
        .textContent =
        users.filter(
            user =>
            user.role ===
            "student"
        ).length;


    $("courseCount")
        .textContent =
        courses.length;


    $("publishedCount")
        .textContent =
        courses.filter(
            course =>
            course.published
        ).length;


    $("videoCount")
        .textContent =
        courses.reduce(
            (total,course) =>
            total +
            (course.lessonCount || 0),
            0
        );

}


/* ==========================================
   講座作成
========================================== */

async function createCourse(){

    const title =
        prompt(
            "講座名を入力してください。"
        );


    if(
        !title ||
        !title.trim()
    )
        return;


    try{

        const reference =
            await addDoc(
                collection(
                    db,
                    "courses"
                ),
                {

                    title:
                    title.trim(),

                    description:
                    "",

                    published:
                    false,

                    lessonCount:
                    0,

                    createdAt:
                    serverTimestamp(),

                    updatedAt:
                    serverTimestamp()

                }
            );


        courses.push({

            id:
            reference.id,

            title:
            title.trim(),

            description:
            "",

            published:
            false,

            lessonCount:
            0

        });


        renderTeacherCourses();

        renderDashboard();

        status(
            "講座を保存しました。"
        );

    }

    catch(error){

        alert(
            "講座を作成できませんでした。"
        );

    }

}


/* ==========================================
   講座保存
========================================== */

async function saveCourse(
    course
){

    try{

        await setDoc(
            doc(
                db,
                "courses",
                course.id
            ),
            {

                title:
                course.title,

                description:
                course.description ||
                "",

                published:
                !!course.published,

                lessonCount:
                course.lessonCount ||
                0,

                updatedAt:
                serverTimestamp()

            },
            {
                merge:
                true
            }
        );


        status(
            "自動保存しました。"
        );

    }

    catch(error){

        status(
            "保存できませんでした。"
        );

    }

}


/* ==========================================
   講座管理
========================================== */

function renderTeacherCourses(){

    const box =
        $("teacherCourses");


    box.innerHTML =
        "";


    courses.forEach(
        course => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <label>
                    講座名
                </label>

                <input
                    class="courseName">

                <label>
                    講座説明
                </label>

                <textarea
                    class="courseDescription">
                </textarea>

                <p
                    class="courseState">
                </p>

                <div class="actions">

                    <button
                        class="primary">
                        動画管理
                    </button>

                    <button>
                        公開切替
                    </button>

                    <button
                        class="danger">
                        削除
                    </button>

                </div>

                <div
                    class="lessonManager hidden">
                </div>

            `;


            const title =
                card.querySelector(
                    ".courseName"
                );


            const description =
                card.querySelector(
                    ".courseDescription"
                );


            const state =
                card.querySelector(
                    ".courseState"
                );


            title.value =
                course.title ||
                "";


            description.value =
                course.description ||
                "";


            function updateState(){

                state.textContent =
                    (course.lessonCount || 0)
                    +
                    "動画 / "
                    +
                    (
                        course.published
                        ?
                        "公開中"
                        :
                        "非公開"
                    );

            }


            updateState();


            title.onchange =
                async () => {

                    course.title =
                        title.value.trim();

                    await saveCourse(
                        course
                    );

                };


            description.onchange =
                async () => {

                    course.description =
                        description.value;

                    await saveCourse(
                        course
                    );

                };


            const buttons =
                card.querySelectorAll(
                    "button"
                );


            buttons[0].onclick =
                () =>
                toggleLessonManager(
                    course,
                    card.querySelector(
                        ".lessonManager"
                    )
                );


            buttons[1].onclick =
                async () => {

                    course.published =
                        !course.published;

                    updateState();

                    await saveCourse(
                        course
                    );

                };


            buttons[2].onclick =
                async () => {

                    if(
                        !confirm(
                            "この講座を削除しますか？"
                        )
                    )
                        return;


                    try{

                        await deleteDoc(
                            doc(
                                db,
                                "courses",
                                course.id
                            )
                        );


                        courses =
                            courses.filter(
                                item =>
                                item.id !==
                                course.id
                            );


                        renderTeacherCourses();

                        renderDashboard();

                    }

                    catch(error){

                        alert(
                            "削除できませんでした。"
                        );

                    }

                };


            box.appendChild(
                card
            );

        }
    );


    if(
        !courses.length
    ){

        box.innerHTML =
            '<div class="card">講座がありません。</div>';

    }

}


/* ==========================================
   動画管理
========================================== */

async function toggleLessonManager(
    course,
    container
){

    container.classList.toggle(
        "hidden"
    );


    if(
        container.classList.contains(
            "hidden"
        )
    )
        return;


    container.innerHTML =
        "<p>読み込み中...</p>";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "courses",
                    course.id,
                    "lessons"
                )
            );


        const lessons =
            snapshot.docs
                .map(
                    document => ({

                        id:
                        document.id,

                        ...document.data()

                    })
                )
                .sort(
                    (a,b) =>
                    (a.order || 0)
                    -
                    (b.order || 0)
                );


        container.innerHTML = `

            <hr>

            <h3>
                動画管理
            </h3>

            <button
                class="primary">
                ＋ 動画を追加
            </button>

            <div
                class="lessonItems">
            </div>

        `;


        container
            .querySelector(
                "button"
            )
            .onclick =
            () =>
            addLesson(
                course,
                container
            );


        const list =
            container.querySelector(
                ".lessonItems"
            );


        lessons.forEach(
            lesson => {

                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "card";


                box.innerHTML = `

                    <label>
                        動画タイトル
                    </label>

                    <input
                        class="lessonTitle">

                    <label>
                        動画URL
                    </label>

                    <input
                        class="lessonUrl">

                    <label>
                        備考
                    </label>

                    <textarea
                        class="lessonNote">
                    </textarea>

                    <label>
                        公開
                    </label>

                    <select
                        class="lessonPublished">

                        <option value="true">
                            公開
                        </option>

                        <option value="false">
                            非公開
                        </option>

                    </select>

                    <div class="actions">

                        <button
                            class="primary">
                            保存
                        </button>

                        <button
                            class="danger">
                            削除
                        </button>

                    </div>

                `;


                box.querySelector(
                    ".lessonTitle"
                ).value =
                    lesson.title ||
                    "";


                box.querySelector(
                    ".lessonUrl"
                ).value =
                    lesson.videoUrl ||
                    "";


                box.querySelector(
                    ".lessonNote"
                ).value =
                    lesson.note ||
                    "";


                box.querySelector(
                    ".lessonPublished"
                ).value =
                    String(
                        lesson.published !==
                        false
                    );


                box.querySelectorAll(
                    "button"
                )[0]
                .onclick =
                async () => {

                    try{

                        await setDoc(
                            doc(
                                db,
                                "courses",
                                course.id,
                                "lessons",
                                lesson.id
                            ),
                            {

                                title:
                                box.querySelector(
                                    ".lessonTitle"
                                ).value.trim(),

                                videoUrl:
                                box.querySelector(
                                    ".lessonUrl"
                                ).value.trim(),

                                note:
                                box.querySelector(
                                    ".lessonNote"
                                ).value,

                                published:
                                box.querySelector(
                                    ".lessonPublished"
                                ).value ===
                                "true",

                                order:
                                lesson.order ||
                                0,

                                updatedAt:
                                serverTimestamp()

                            },
                            {
                                merge:
                                true
                            }
                        );


                        status(
                            "動画を自動保存しました。"
                        );

                    }

                    catch(error){

                        alert(
                            "動画を保存できませんでした。"
                        );

                    }

                };


                box.querySelectorAll(
                    "button"
                )[1]
                .onclick =
                async () => {

                    if(
                        !confirm(
                            "この動画を削除しますか？"
                        )
                    )
                        return;


                    await deleteDoc(
                        doc(
                            db,
                            "courses",
                            course.id,
                            "lessons",
                            lesson.id
                        )
                    );


                    course.lessonCount =
                        Math.max(
                            0,
                            (course.lessonCount || 1)
                            -
                            1
                        );


                    await saveCourse(
                        course
                    );


                    container.innerHTML =
                        "";


                    await toggleLessonManager(
                        course,
                        container
                    );

                };


                list.appendChild(
                    box
                );

            }
        );


        if(
            !lessons.length
        ){

            list.innerHTML =
                '<p class="muted">動画がありません。</p>';

        }

    }

    catch(error){

        console.error(
            error
        );


        container.innerHTML =
            '<div class="error">動画を読み込めませんでした。</div>';

    }

}


/* 動画追加 */

async function addLesson(
    course,
    container
){

    const title =
        prompt(
            "動画タイトルを入力してください。"
        );


    if(
        !title?.trim()
    )
        return;


    const url =
        prompt(
            "Cloudinaryの動画URLを入力してください。"
        );


    if(
        !url?.trim()
    )
        return;


    const note =
        prompt(
            "備考を入力してください。"
        )
        ||
        "";


    try{

        const order =
            (course.lessonCount || 0)
            +
            1;


        await addDoc(
            collection(
                db,
                "courses",
                course.id,
                "lessons"
            ),
            {

                title:
                title.trim(),

                videoUrl:
                url.trim(),

                note:
                note,

                published:
                false,

                order:
                order,

                createdAt:
                serverTimestamp(),

                updatedAt:
                serverTimestamp()

            }
        );


        course.lessonCount =
            order;


        await saveCourse(
            course
        );


        container.innerHTML =
            "";


        await toggleLessonManager(
            course,
            container
        );


        renderTeacherCourses();

        renderDashboard();

    }

    catch(error){

        alert(
            "動画を追加できませんでした。"
        );

    }

}

function renderUsers(){

    const body =
        $("userTable");


    body.innerHTML =
        "";


    users.forEach(
        user => {

            const row =
                document.createElement(
                    "tr"
                );


            const email =
                document.createElement(
                    "td"
                );


            email.textContent =
                user.email ||
                "";


            const role =
                document.createElement(
                    "td"
                );


            role.textContent =
                user.role ===
                "teacher"

                "先生・管理者"
                :
                "生徒";


            row.append(
                email,
                role
            );


            body.appendChild(
                row
            );

        }
    );

}


function openCreateUser(){

    $("createUserBox")
        .classList
        .remove("hidden");

}


function closeCreateUser(){

    $("createUserBox")
        .classList
        .add("hidden");

}


async function createUser(){

    const email =
        $("newEmail")
        .value
        .trim();


    const password =
        $("newPassword")
        .value;


    const role =
        $("newRole")
        .value;


    clearError(
        "userError"
    );


    if(
        !email ||
        password.length < 6
    ){

        showError(
            "userError",
            "メールアドレスと6文字以上のパスワードを入力してください。"
        );

        return;

    }


    try{

        const result =
            await createUserServer({

                email:
                email,

                password:
                password,

                role:
                role

            });


        users.push({

            id:
            result.data.uid,

            email:
            email,

            role:
            role

        });


        renderUsers();

        renderNoticeUsers();

        renderDashboard();

        closeCreateUser();


        $("newEmail").value =
            "";


        $("newPassword").value =
            "";


        status(
            "ユーザーを作成しました。"
        );

    }

    catch(error){

        console.error(
            error
        );


        showError(
            "userError",
            "ユーザーを作成できませんでした。"
        );

    }

}

/* ==========================================
   ロゴ
========================================== */

async function uploadLogo(){

    const file =
        $("logoFile")
        .files[0];


    if(!file){

        alert(
            "ロゴ画像を選択してください。"
        );

        return;

    }


    try{

        const result =
            (
                await getCloudinarySignature({

                    resourceType:
                    "image",

                    folder:
                    "web-course/logo"

                })
            ).data;


        const form =
            new FormData();


        form.append(
            "file",
            file
        );


        form.append(
            "api_key",
            result.apiKey
        );


        form.append(
            "timestamp",
            result.timestamp
        );


        form.append(
            "signature",
            result.signature
        );


        form.append(
            "folder",
            result.folder
        );


        const response =
            await fetch(

                `https://api.cloudinary.com/v1_1/${result.cloudName}/image/upload`,

                {

                    method:
                    "POST",

                    body:
                    form

                }

            );


        if(
            !response.ok
        )
            throw new Error();


        const uploaded =
            await response.json();


        await setDoc(
            doc(
                db,
                "settings",
                "site"
            ),
            {

                logoUrl:
                uploaded.secure_url,

                updatedAt:
                serverTimestamp()

            },
            {
                merge:
                true
            }
        );


        applyLogo(
            uploaded.secure_url
        );


        status(
            "ロゴを保存しました。"
        );

    }

    catch(error){

        console.error(
            error
        );


        alert(
            "ロゴをアップロードできませんでした。"
        );

    }

}


function applyLogo(url){

    if(!url)
        return;


    $("logo")
        .src =
        url;


    $("logo")
        .classList
        .remove("hidden");


    $("brand")
        .classList
        .add("hidden");

}
