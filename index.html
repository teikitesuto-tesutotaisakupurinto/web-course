<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>定期テスト対策プリント運営事務局｜WEB講座</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f6f8;color:#222}
header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}
.brand{font-weight:700}
.logo{max-width:220px;max-height:44px;object-fit:contain}
main{max-width:1100px;margin:auto;padding:28px 18px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:22px;margin-bottom:18px}
.login{max-width:450px;margin:70px auto}
label{display:block;font-weight:650;margin:14px 0 7px}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;background:#fff}
textarea{min-height:110px;resize:vertical}
button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:10px 15px;cursor:pointer}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#222;color:#fff;border-color:#222}
.danger{background:#b42318;color:#fff;border-color:#b42318}
.hidden{display:none!important}
.error{background:#fff1f1;color:#a00000;border:1px solid #e0aaaa;padding:12px;border-radius:8px;margin-bottom:15px}
.muted{color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}
.nav{margin-bottom:20px}
.actions{margin-top:15px}
.lesson{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #eee}
.lesson:last-child{border-bottom:0}
video{width:100%;max-height:75vh;background:#000;border-radius:10px}
.stat{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px}
.stat strong{display:block;font-size:28px;margin-top:5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}
.save-status{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid #ddd;padding:10px 15px;border-radius:999px;box-shadow:0 5px 20px #0001;z-index:100}
@media(max-width:600px){header{padding:0 12px}main{padding:20px 12px}.brand{font-size:14px}}
</style>
</head>

<body>

<header>

<div>
<img id="logo" class="logo hidden" alt="ロゴ">
<span id="brand" class="brand">
定期テスト対策プリント運営事務局｜WEB講座
</span>
</div>

<button
id="logoutButton"
class="hidden"
onclick="logout()">
ログアウト
</button>

</header>

<main>

<!-- =========================
ログイン
========================= -->

<section id="loginScreen" class="screen active">

<div class="card login">

<h1>WEB講座</h1>

<p class="muted">
メールアドレスとパスワードでログインしてください。
</p>

<div id="loginError" class="error hidden"></div>

<label>メールアドレス</label>

<input
id="email"
type="email"
autocomplete="username">

<label>パスワード</label>

<input
id="password"
type="password"
autocomplete="current-password">

<button
id="loginButton"
class="primary"
style="width:100%;margin-top:10px"
onclick="login()">

ログイン

</button>

</div>

</section>


<!-- =========================
生徒
========================= -->

<section id="studentScreen" class="screen">

<h1>WEB講座</h1>

<p class="muted">
受講する講座を選択してください。
</p>

<div id="studentError" class="error hidden"></div>

<div id="studentCourses" class="grid"></div>

</section>


<!-- =========================
講座
========================= -->

<section id="courseScreen" class="screen">

<div class="nav">

<button onclick="goStudent()">
← 講座一覧
</button>

</div>

<div class="card">

<h1 id="courseTitle"></h1>

<p id="courseDescription" class="muted"></p>

<div id="lessonList"></div>

</div>

</section>


<!-- =========================
動画
========================= -->

<section id="videoScreen" class="screen">

<div class="nav">

<button onclick="goCourse()">
← 動画一覧
</button>

</div>

<div class="card">

<video
id="videoPlayer"
controls
playsinline
controlsList="nodownload">
</video>

<h2 id="videoTitle"></h2>

<h3>備考</h3>

<p
id="videoNote"
style="white-space:pre-wrap">
</p>

</div>

</section>


<!-- =========================
先生・管理者
========================= -->

<section id="teacherScreen" class="screen">

<h1>先生・管理者</h1>

<div class="nav">

<button onclick="teacherTab('dashboard')">
ダッシュボード
</button>

<button onclick="teacherTab('courses')">
講座管理
</button>

<button onclick="teacherTab('users')">
ユーザー管理
</button>

<button onclick="teacherTab('notice')">
アカウント情報通知書
</button>

<button onclick="teacherTab('settings')">
サイト設定
</button>

</div>


<!-- ダッシュボード -->

<section id="dashboardTab">

<div class="grid">

<div class="stat">
生徒数
<strong id="studentCount">0</strong>
</div>

<div class="stat">
先生数
<strong id="teacherCount">0</strong>
</div>

<div class="stat">
講座数
<strong id="courseCount">0</strong>
</div>

<div class="stat">
公開講座
<strong id="publishedCount">0</strong>
</div>

<div class="stat">
動画数
<strong id="videoCount">0</strong>
</div>

</div>

</section>


<!-- 講座管理 -->

<section
id="coursesTab"
class="hidden">

<div class="row">

<h2>講座管理</h2>

<button
class="primary"
onclick="createCourse()">

＋ 講座を作成

</button>

</div>

<div id="teacherCourses"></div>

</section>


<!-- ユーザー -->

<section
id="usersTab"
class="hidden">

<div class="card">

<div class="row">

<h2>ユーザー管理</h2>

<button
class="primary"
onclick="openCreateUser()">

＋ ユーザーを追加

</button>

</div>

<div
id="userError"
class="error hidden">
</div>

<table>

<thead>

<tr>
<th>メールアドレス</th>
<th>権限</th>
</tr>

</thead>

<tbody id="userTable"></tbody>

</table>

</div>


<div
id="createUserBox"
class="card hidden">

<h3>ユーザーを追加</h3>

<label>メールアドレス</label>

<input
id="newEmail"
type="email">

<label>初期パスワード</label>

<input
id="newPassword"
type="password">

<label>権限</label>

<select id="newRole">

<option value="student">
生徒
</option>

<option value="teacher">
先生・管理者
</option>

</select>

<div class="actions">

<button
class="primary"
onclick="createUser()">

作成

</button>

<button
onclick="closeCreateUser()">

キャンセル

</button>

</div>

</div>

</section>


<!-- 通知書 -->

<section
id="noticeTab"
class="hidden">

<div class="card">

<h2>
アカウント情報通知書
</h2>

<select
id="noticeUser">
</select>

<button
class="primary"
style="margin-top:12px"
onclick="printNotice()">

通知書を表示・印刷

</button>

</div>

</section>


<!-- 設定 -->

<section
id="settingsTab"
class="hidden">

<div class="card">

<h2>サイト設定</h2>

<label>ロゴ画像</label>

<input
id="logoFile"
type="file"
accept="image/*">

<button
class="primary"
onclick="previewLogo()">

ロゴを反映

</button>

</div>

</section>

</section>

</main>


<div
id="saveStatus"
class="save-status">
</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
getDoc,
doc,
addDoc,
setDoc,
deleteDoc,
serverTimestamp,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
Firebase
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyCDDFw2tipCJs_k00E5txFrCW7bVsgJ3O8",

authDomain:
"web-course-1589c.firebaseapp.com",

projectId:
"web-course-1589c",

storageBucket:
"web-course-1589c.firebasestorage.app",

messagingSenderId:
"175601141864",

appId:
"1:175601141864:web:ac9092e86c111fa4a053dd"

};


const app =
initializeApp(
firebaseConfig
);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =========================
状態
========================= */

let currentUser =
null;

let currentRole =
null;

let courses =
[];

let users =
[];

let currentCourse =
null;


/* =========================
DOM
========================= */

function $(id){

return document.getElementById(id);

}


/* =========================
画面
========================= */

function showScreen(id){

document
.querySelectorAll(".screen")
.forEach(
screen =>
screen.classList.remove("active")
);


$(id)
.classList
.add("active");


window.scrollTo(
0,
0
);

}


/* =========================
エラー
========================= */

function showError(
id,
message
){

$(id)
.textContent =
message;

$(id)
.classList
.remove("hidden");

}


function clearError(id){

$(id)
.textContent =
"";

$(id)
.classList
.add("hidden");

}


/* =========================
保存表示
========================= */

function status(message){

$("saveStatus")
.textContent =
message;


setTimeout(
() => {

$("saveStatus")
.textContent =
"";

},
1800
);

}


/* =========================
ログイン
========================= */

async function login(){

const email =
$("email")
.value
.trim();


const password =
$("password")
.value;


clearError(
"loginError"
);


if(
!email ||
!password
){

showError(
"loginError",
"メールアドレスとパスワードを入力してください。"
);

return;

}


$("loginButton")
.disabled =
true;


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

catch(error){

console.error(
error
);


showError(
"loginError",
"ログインできませんでした。メールアドレスまたはパスワードを確認してください。"
);

}

finally{

$("loginButton")
.disabled =
false;

}

}


/* =========================
認証状態
========================= */

onAuthStateChanged(
auth,
async user => {

if(!user){

currentUser =
null;

currentRole =
null;


$("logoutButton")
.classList
.add("hidden");


showScreen(
"loginScreen"
);


return;

}


currentUser =
user;


$("logoutButton")
.classList
.remove("hidden");


/*
ログイン成功したので
エラー表示を完全に消す
*/

clearError(
"loginError"
);


/*
まず画面を決める
*/

currentRole =
await getRole(
user.uid
);


if(
currentRole ===
"teacher"
){

showScreen(
"teacherScreen"
);

await loadTeacherData();

teacherTab(
"dashboard"
);

}
else{

showScreen(
"studentScreen"
);

await loadStudentData();

}

}
);


/* =========================
権限
========================= */

async function getRole(uid){

try{

const snapshot =
await getDoc(
doc(
db,
"users",
uid
)
);


if(
snapshot.exists()
){

return snapshot.data().role ===
"teacher"
?
"teacher"
:
"student";

}

}
catch(error){

console.error(
"role error",
error
);

}


return "student";

}


/* =========================
ログアウト
========================= */

async function logout(){

await signOut(
auth
);

}


/* =========================
生徒データ
========================= */

async function loadStudentData(){

clearError(
"studentError"
);


try{

const snapshot =
await getDocs(
query(
collection(
db,
"courses"
),
where(
"published",
"==",
true
)
)
);


courses =
snapshot.docs.map(
document => ({

id:
document.id,

...document.data()

})
);


renderStudentCourses();

}

catch(error){

console.error(
error
);


showError(
"studentError",
"講座を読み込めませんでした。"
);

}

}


/* =========================
生徒講座
========================= */

function renderStudentCourses(){

const box =
$("studentCourses");


box.innerHTML =
"";


if(
courses.length ===
0
){

box.innerHTML =
'<div class="card">公開中の講座はありません。</div>';

return;

}


courses.forEach(
course => {

const card =
document.createElement(
"div"
);


card.className =
"card";


const title =
document.createElement(
"h2"
);


title.textContent =
course.title;


const description =
document.createElement(
"p"
);


description.className =
"muted";


description.textContent =
course.description ||
"";


const count =
document.createElement(
"p"
);


count.textContent =
(
course.lessonCount ||
0
)
+
"動画";


const button =
document.createElement(
"button"
);


button.className =
"primary";


button.textContent =
"講座を見る";


button.onclick =
() =>
openCourse(
course.id
);


card.append(
title,
description,
count,
button
);


box.appendChild(
card
);

}
);

}


/* =========================
生徒トップ
========================= */

async function goStudent(){

showScreen(
"studentScreen"
);

await loadStudentData();

}


/* =========================
講座
========================= */

async function openCourse(
courseId
){

currentCourse =
courses.find(
course =>
course.id ===
courseId
);


if(
!currentCourse
)
return;


$("courseTitle")
.textContent =
currentCourse.title;


$("courseDescription")
.textContent =
currentCourse.description ||
"";


const list =
$("lessonList");


list.innerHTML =
"<p>読み込み中...</p>";


try{

const snapshot =
await getDocs(
query(
collection(
db,
"courses",
courseId,
"lessons"
),
where(
"published",
"==",
true
)
)
);


const lessons =
snapshot.docs
.map(
document => ({

id:
document.id,

...document.data()

})
)
.sort(
(a,b) =>
(a.order || 0)
-
(b.order || 0)
);


list.innerHTML =
"";


if(
lessons.length ===
0
){

list.innerHTML =
'<p class="muted">公開中の動画はありません。</p>';

}
else{

lessons.forEach(
(lesson,index) => {

const row =
document.createElement(
"div"
);


row.className =
"lesson";


const title =
document.createElement(
"span"
);


title.textContent =
String(
index + 1
)
.padStart(
2,
"0"
)
+
" "
+
lesson.title;


const button =
document.createElement(
"button"
);


button.textContent =
"見る";


button.onclick =
() =>
openVideo(
lesson
);


row.append(
title,
button
);


list.appendChild(
row
);

});

}


showScreen(
"courseScreen"
);

}
catch(error){

console.error(
error
);


list.innerHTML =
'<div class="error">動画一覧を読み込めませんでした。</div>';


showScreen(
"courseScreen"
);

}

}


/* =========================
動画
========================= */

function openVideo(
lesson
){

$("videoTitle")
.textContent =
lesson.title;


$("videoNote")
.textContent =
lesson.note ||
"";


$("videoPlayer")
.src =
lesson.videoUrl;


$("videoPlayer")
.load();


showScreen(
"videoScreen"
);

}


function goCourse(){

if(
currentCourse
){

openCourse(
currentCourse.id
);

}

}


/* =========================
先生
========================= */

async function loadTeacherData(){

try{

const [
courseSnapshot,
userSnapshot
]
=
await Promise.all([

getDocs(
collection(
db,
"courses"
)
),

getDocs(
collection(
db,
"users"
)
)

]);


courses =
courseSnapshot.docs.map(
document => ({

id:
document.id,

...document.data()

})
);


users =
userSnapshot.docs.map(
document => ({

id:
document.id,

...document.data()

})
);


}
catch(error){

console.error(
error
);

}

}


/* =========================
先生タブ
========================= */

function teacherTab(
tab
){

[
"dashboardTab",
"coursesTab",
"usersTab",
"noticeTab",
"settingsTab"
]
.forEach(
id =>
$(id)
.classList
.add("hidden")
);


const tabs = {

dashboard:
"dashboardTab",

courses:
"coursesTab",

users:
"usersTab",

notice:
"noticeTab",

settings:
"settingsTab"

};


$(tabs[tab])
.classList
.remove("hidden");


if(
tab ===
"dashboard"
){

renderDashboard();

}


if(
tab ===
"courses"
){

renderTeacherCourses();

}


if(
tab ===
"users"
){

renderUsers();

}


if(
tab ===
"notice"
){

renderNoticeUsers();

}

}


/* =========================
ダッシュボード
========================= */

function renderDashboard(){

$("studentCount")
.textContent =
users.filter(
user =>
user.role ===
"student"
).length;


$("teacherCount")
.textContent =
users.filter(
user =>
user.role ===
"teacher"
).length;


$("courseCount")
.textContent =
courses.length;


$("publishedCount")
.textContent =
courses.filter(
course =>
course.published
).length;


$("videoCount")
.textContent =
courses.reduce(
(total,course) =>
total +
(
course.lessonCount ||
0
),
0
);

}


/* =========================
講座作成
========================= */

async function createCourse(){

const title =
prompt(
"講座名を入力してください。"
);


if(
!title ||
!title.trim()
)
return;


try{

const reference =
await addDoc(
collection(
db,
"courses"
),
{

title:
title.trim(),

description:
"",

published:
false,

lessonCount:
0,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}
);


courses.push({

id:
reference.id,

title:
title.trim(),

description:
"",

published:
false,

lessonCount:
0

});


renderTeacherCourses();

renderDashboard();

status(
"講座を作成しました。"
);

}

catch(error){

console.error(
error
);

status(
"講座を保存できませんでした。"
);

}

}


/* =========================
講座管理
========================= */

function renderTeacherCourses(){

const box =
$("teacherCourses");


box.innerHTML =
"";


if(
courses.length ===
0
){

box.innerHTML =
'<div class="card">講座がありません。</div>';

return;

}


courses.forEach(
course => {

const card =
document.createElement(
"div"
);


card.className =
"card";


card.innerHTML = `

<label>
講座名
</label>

<input class="courseName">

<label>
説明
</label>

<textarea class="courseDescription"></textarea>

<p class="courseState"></p>

<div class="actions">

<button class="primary">
動画管理
</button>

<button>
公開切替
</button>

<button class="danger">
削除
</button>

</div>

<div class="lessonManager hidden"></div>

`;


const name =
card.querySelector(
".courseName"
);


const description =
card.querySelector(
".courseDescription"
);


const state =
card.querySelector(
".courseState"
);


name.value =
course.title ||
"";


description.value =
course.description ||
"";


function updateState(){

state.textContent =
(course.lessonCount || 0)
+
"動画 / "
+
(
course.published
?
"公開中"
:
"非公開"
);

}


updateState();


name.onchange =
async () => {

course.title =
name.value.trim();

await saveCourse(
course
);

};


description.onchange =
async () => {

course.description =
description.value;

await saveCourse(
course
);

};


const buttons =
card.querySelectorAll(
"button"
);


buttons[0].onclick =
() =>
toggleLessonManager(
course,
card.querySelector(
".lessonManager"
)
);


buttons[1].onclick =
async () => {

course.published =
!course.published;

updateState();

await saveCourse(
course
);

renderDashboard();

};


buttons[2].onclick =
async () => {

if(
!confirm(
"この講座を削除しますか？"
)
)
return;


try{

await deleteDoc(
doc(
db,
"courses",
course.id
)
);


courses =
courses.filter(
item =>
item.id !==
course.id
);


renderTeacherCourses();

renderDashboard();

status(
"講座を削除しました。"
);

}
catch(error){

console.error(
error
);

status(
"講座を削除できませんでした。"
);

}

};


box.appendChild(
card
);

}
);

}


/* =========================
講座保存
========================= */

async function saveCourse(
course
){

try{

await setDoc(
doc(
db,
"courses",
course.id
),
{

title:
course.title,

description:
course.description ||
"",

published:
!!course.published,

lessonCount:
course.lessonCount ||
0,

updatedAt:
serverTimestamp()

},
{
merge:true
}
);


status(
"自動保存しました。"
);

}

catch(error){

console.error(

/* =========================
動画管理
========================= */

async function toggleLessonManager(
course,
container
){

container.classList.toggle(
"hidden"
);


if(
container.classList.contains(
"hidden"
)
)
return;


container.innerHTML =
"<p>読み込み中...</p>";


try{

const snapshot =
await getDocs(
collection(
db,
"courses",
course.id,
"lessons"
)
);


const lessons =
snapshot.docs.map(
document => ({

id:
document.id,

...document.data()

})
);


container.innerHTML = `

<hr>

<h3>
動画管理
</h3>

<button class="primary">
＋ 動画を追加
</button>

<div class="lessonItems"></div>

`;


const list =
container.querySelector(
".lessonItems"
);


container
.querySelector(
"button"
)
.onclick =
() =>
addLesson(
course,
container
);


lessons.forEach(
lesson => {

const box =
document.createElement(
"div"
);


box.className =
"card";


box.innerHTML = `

<label>
動画タイトル
</label>

<input class="lessonTitle">

<label>
Cloudinary動画URL
</label>

<input class="lessonUrl">

<label>
備考
</label>

<textarea class="lessonNote"></textarea>

<label>
公開
</label>

<select class="lessonPublished">

<option value="true">
公開
</option>

<option value="false">
非公開
</option>

</select>

<div class="actions">

<button class="primary">
保存
</button>

<button class="danger">
削除
</button>

</div>

`;


box.querySelector(
".lessonTitle"
)
.value =
lesson.title ||
"";


box.querySelector(
".lessonUrl"
)
.value =
lesson.videoUrl ||
"";


box.querySelector(
".lessonNote"
)
.value =
lesson.note ||
"";


box.querySelector(
".lessonPublished"
)
.value =
String(
lesson.published !==
false
);


box.querySelectorAll(
"button"
)[0]
.onclick =
async () => {

try{

await setDoc(
doc(
db,
"courses",
course.id,
"lessons",
lesson.id
),
{

title:
box.querySelector(
".lessonTitle"
).value.trim(),

videoUrl:
box.querySelector(
".lessonUrl"
).value.trim(),

note:
box.querySelector(
".lessonNote"
).value,

published:
box.querySelector(
".lessonPublished"
).value ===
"true",

order:
lesson.order ||
0,

updatedAt:
serverTimestamp()

},
{
merge:true
}
);


status(
"動画を保存しました。"
);

}
catch(error){

console.error(
error
);

status(
"動画を保存できませんでした。"
);

}

};


box.querySelectorAll(
"button"
)[1]
.onclick =
async () => {

if(
!confirm(
"この動画を削除しますか？"
)
)
return;


try{

await deleteDoc(
doc(
db,
"courses",
course.id,
"lessons",
lesson.id
)
);


course.lessonCount =
Math.max(
0,
(course.lessonCount || 1)
-
1
);


await saveCourse(
course
);


await toggleLessonManager(
course,
container
);


renderTeacherCourses();

renderDashboard();

}
catch(error){

status(
"動画を削除できませんでした。"
);

}

};


list.appendChild(
box
);

});


if(
lessons.length ===
0
){

list.innerHTML =
'<p class="muted">動画がありません。</p>';

}

}
catch(error){

container.innerHTML =
'<div class="error">動画を読み込めませんでした。</div>';

}

}


/* =========================
動画追加
========================= */

async function addLesson(
course,
container
){

const title =
prompt(
"動画タイトルを入力してください。"
);


if(
!title ||
!title.trim()
)
return;


const url =
prompt(
"Cloudinaryの動画URLを入力してください。"
);


if(
!url ||
!url.trim()
)
return;


const note =
prompt(
"備考を入力してください。"
)
||
"";


try{

const order =
(course.lessonCount || 0)
+
1;


await addDoc(
collection(
db,
"courses",
course.id,
"lessons"
),
{

title:
title.trim(),

videoUrl:
url.trim(),

note:
note,

published:
false,

order:
order,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}
);


course.lessonCount =
order;


await saveCourse(
course
);


container.innerHTML =
"";


await toggleLessonManager(
course,
container
);


renderTeacherCourses();

renderDashboard();

status(
"動画を追加しました。"
);

}
catch(error){

console.error(
error
);

status(
"動画を追加できませんでした。"
);

}

}

/* =========================
HTMLエスケープ
========================= */

function escapeHtml(value){

return String(value)
.replace(
/[&<>"']/g,
char => ({

"&":
"&amp;",

"<":
"&lt;",

">":
"&gt;",

'"':
"&quot;",

"'":
"&#39;"

})[char]
);

}
